# The whole Playwright suite, on request: Actions > End-to-end > Run workflow, or `gh workflow run e2e.yml --ref <branch>`.
name: End-to-end

on:
  workflow_dispatch:
    inputs:
      args:
        description: Arguments for playwright test, e.g. --project=webkit tests/viewer.spec.ts
        required: false
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - name: Start the stack
        run: scripts/start.sh
      # The Playwright image, as locally, so screenshots match their baselines. CI is set: failing tests are retried.
      - name: Run the Playwright suite
        run: |
          # shellcheck disable=SC2086 # unquoted, so the arguments split into words
          scripts/e2e.sh $ARGS
        env:
          ARGS: ${{ inputs.args }}
      - name: Show the stack's logs
        if: failure()
        run: docker compose logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
